<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333ea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Cercle de fond -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" stroke="#ffffff" stroke-width="8"/>

  <!-- Billet de banque -->
  <rect x="156" y="180" width="200" height="120" rx="12" fill="url(#grad2)" stroke="#ffffff" stroke-width="4"/>
  <rect x="166" y="190" width="180" height="100" rx="8" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8,4"/>

  <!-- Symbole Euro -->
  <text x="256" y="265" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#ffffff" text-anchor="middle">€</text>

  <!-- Point d'interrogation -->
  <circle cx="340" cy="160" r="35" fill="#ffd93d" stroke="#ffffff" stroke-width="3"/>
  <text x="340" y="178" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#4f46e5" text-anchor="middle">?</text>

  <!-- Étoiles décoratives -->
  <text x="120" y="140" font-size="30" fill="#ffd93d">⭐</text>
  <text x="380" y="380" font-size="25" fill="#ffd93d">⭐</text>
  <text x="140" y="420" font-size="20" fill="#ffd93d">⭐</text>
  <text x="360" y="130" font-size="20" fill="#ffd93d">⭐</text>

  <!-- Petites bulles -->
  <circle cx="180" cy="140" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="400" r="8" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="280" r="5" fill="#ffffff" opacity="0.6"/>
</svg>